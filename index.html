<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hello World</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #2cd91c, #4de0c3);
        }

        .container {
            background: white;
            padding: 50px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #667eea;
            font-size: 50px;
            margin-bottom: 15px;
        }

        p {
            color: #555;
            font-size: 20px;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: #764ba2;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .button:hover {
            background: #667eea;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>🌍 Hello World!</h1>

        <p>
            Welcome to my first GitHub Actions website.
        </p>

        <a class="button" href="https://github.com/">
            Visit GitHub
        </a>
    </div>

</body>
</html>
